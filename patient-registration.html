<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Online Registration - React</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="form.css">
    <style>
        input.invalid,
        select.invalid,
        textarea.invalid {
            border: 2px solid #c62828 !important;
            background-color: #fff5f5 !important;
        }
        input[type="radio"].invalid,
        input[type="checkbox"].invalid {
            outline: 2px solid #c62828 !important;
            outline-offset: 2px;
        }
        .error-msg {
            color: #c62828;
            font-size: 0.88em;
            margin-left: 8px;
            font-weight: bold;
            vertical-align: middle;
        }
    </style>

    <!-- React 18 & Babel (Local scripts for offline lab use, with CDN fallback) -->
    <script src="js/react.development.js"></script>
    <script src="js/react-dom.development.js"></script>
    <script src="js/babel.min.js"></script>
    <script>
        if (!window.React) {
            document.write('<script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"><\/script>');
            document.write('<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"><\/script>');
            document.write('<script src="https://unpkg.com/@babel/standalone/babel.min.js"><\/script>');
        }
    </script>
</head>
<body>

    <!-- React Container -->
    <div id="root"></div>

    <br><br><br>
    <nav>
        <a href="index.html">Home</a>
    </nav>

    <!-- ========================================== -->
    <!--  REACT IMPLEMENTATION OF REGISTRATION FORM  -->
    <!-- ========================================== -->
    <script type="text/babel">
        const { useState } = React;

        function PatientRegistration() {
            // Form State
            const initialFormState = {
                name: "",
                age: "",
                Gender: "",
                address: "",
                mobilenumber: "",
                email: "",
                dob: "",
                bloodgroup: "",
                regdate: "",
                dept: "",
                testsel: [],
                pad: "",
                scp: "",
                udp: null
            };

            const [formData, setFormData] = useState(initialFormState);
            const [errors, setErrors] = useState({});
            const [submitted, setSubmitted] = useState(false);

            // Date utility
            const getMidnightToday = () => {
                const today = new Date();
                today.setHours(0, 0, 0, 0);
                return today;
            };

            // Single Field Validator
            const validateField = (field, value) => {
                const today = getMidnightToday();

                switch (field) {
                    case "name": {
                        const val = (value || "").trim();
                        if (!val) return "Name cannot be empty";
                        if (!/^[A-Za-z ]+$/.test(val)) return "Name should contain only letters and spaces";
                        if (val.length < 2) return "Name must be at least 2 characters long";
                        return "";
                    }
                    case "age": {
                        const val = (value || "").toString().trim();
                        const num = Number(val);
                        if (!val) return "Age cannot be empty";
                        if (!/^\d+$/.test(val) || num < 1 || num > 120) return "Enter a valid age between 1 and 120";
                        return "";
                    }
                    case "Gender": {
                        if (!value) return "Please select a gender";
                        return "";
                    }
                    case "address": {
                        const val = (value || "").trim();
                        if (!val) return "Address cannot be empty";
                        if (val.length < 5) return "Address must be at least 5 characters long";
                        return "";
                    }
                    case "mobilenumber": {
                        const val = (value || "").trim();
                        if (!val) return "Mobile number cannot be empty";
                        if (!/^[6-9][0-9]{9}$/.test(val)) return "Enter a valid 10-digit Indian mobile number (starts with 6-9)";
                        return "";
                    }
                    case "email": {
                        const val = (value || "").trim();
                        if (!val) return "Email cannot be empty";
                        if (!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(val)) return "Enter a valid email address (e.g. user@example.com)";
                        return "";
                    }
                    case "dob": {
                        if (!value) return "Date of birth cannot be empty";
                        const d = new Date(value + "T00:00:00");
                        const minDate = new Date();
                        minDate.setFullYear(minDate.getFullYear() - 125);
                        if (isNaN(d.getTime())) return "Enter a valid date of birth";
                        if (d > today) return "Date of birth cannot be in the future";
                        if (d < minDate) return "Date of birth cannot be more than 120 years ago";
                        return "";
                    }
                    case "bloodgroup": {
                        if (!value) return "Please select a blood group";
                        return "";
                    }
                    case "regdate": {
                        if (!value) return "Registration date cannot be empty";
                        const d = new Date(value + "T00:00:00");
                        if (isNaN(d.getTime())) return "Enter a valid registration date";
                        if (d > today) return "Registration date cannot be in the future";
                        return "";
                    }
                    case "dept": {
                        if (!value) return "Please select a department";
                        return "";
                    }
                    case "testsel": {
                        if (!value || value.length === 0) return "Please select at least one test";
                        return "";
                    }
                    case "pad": {
                        if (!value) return "Preferred appointment date cannot be empty";
                        const d = new Date(value + "T00:00:00");
                        if (isNaN(d.getTime())) return "Enter a valid appointment date";
                        if (d < today) return "Appointment date cannot be in the past";
                        return "";
                    }
                    case "scp": {
                        if (!value) return "Please select sample collection preference";
                        return "";
                    }
                    case "udp": {
                        if (!value) return "Please upload doctor's prescription";
                        const allowed = /\.(pdf|jpe?g|png)$/i;
                        if (!allowed.test(value.name || "")) return "Allowed formats: PDF, JPG, JPEG, PNG";
                        return "";
                    }
                    default:
                        return "";
                }
            };

            // REAL-TIME REACTIVE HANDLER:
            // The instant a user enters/selects valid data format, React removes the alert from state!
            const handleChange = (e) => {
                const { name, value, type, checked, files } = e.target;
                let updatedValue = value;

                if (type === "checkbox") {
                    const currentList = formData.testsel || [];
                    if (checked) {
                        updatedValue = [...currentList, value];
                    } else {
                        updatedValue = currentList.filter(item => item !== value);
                    }
                } else if (type === "file") {
                    updatedValue = files && files[0] ? files[0] : null;
                }

                // Update Form Data in React state
                setFormData(prev => ({
                    ...prev,
                    [name]: updatedValue
                }));

                // Reactive Alert Removal:
                // If the field currently has an error (or form was submitted), validate live
                if (submitted || errors[name]) {
                    const fieldError = validateField(name, updatedValue);
                    setErrors(prev => {
                        const updatedErrors = { ...prev };
                        if (!fieldError) {
                            delete updatedErrors[name]; // REMOVES RED ALERT IMMEDIATELY!
                        } else {
                            updatedErrors[name] = fieldError;
                        }
                        return updatedErrors;
                    });
                }
            };

            // On Blur: validate field if user leaves it incomplete
            const handleBlur = (e) => {
                const { name } = e.target;
                const err = validateField(name, formData[name]);
                if (err) {
                    setErrors(prev => ({ ...prev, [name]: err }));
                } else {
                    setErrors(prev => {
                        const updated = { ...prev };
                        delete updated[name];
                        return updated;
                    });
                }
            };

            // Submit Handler: Click "Register"
            const handleSubmit = (e) => {
                e.preventDefault();
                setSubmitted(true);

                const newErrors = {};
                Object.keys(formData).forEach(key => {
                    const err = validateField(key, formData[key]);
                    if (err) {
                        newErrors[key] = err;
                    }
                });

                setErrors(newErrors);

                if (Object.keys(newErrors).length === 0) {
                    alert("Registration successful");
                }
            };

            // Reset Handler: Click "Reset"
            const handleReset = () => {
                setFormData(initialFormState);
                setErrors({});
                setSubmitted(false);
                // Clear file input DOM element if any
                const fileInput = document.getElementById("udp");
                if (fileInput) fileInput.value = "";
            };

            const isInvalid = (field) => Boolean(errors[field]);

            return (
                <div>
                    <h1>Online Registration</h1>
                    <hr />

                    <form onSubmit={handleSubmit} onReset={handleReset} noValidate>
                        {/* Fieldset 1: Personal Details */}
                        <fieldset>
                            <legend>Personal Details</legend>

                            <label htmlFor="name">Patient Name:</label>
                            <input
                                type="text"
                                id="name"
                                name="name"
                                placeholder="Enter your Full name"
                                value={formData.name}
                                onChange={handleChange}
                                onBlur={handleBlur}
                                className={isInvalid("name") ? "invalid" : ""}
                                autoFocus
                            />
                            {errors.name && <span id="nameError" className="error-msg">{errors.name}</span>}
                            <br /><br />

                            <label htmlFor="age">Age:</label>
                            <input
                                type="number"
                                id="age"
                                name="age"
                                placeholder="Enter your Age"
                                value={formData.age}
                                onChange={handleChange}
                                onBlur={handleBlur}
                                className={isInvalid("age") ? "invalid" : ""}
                                required
                            />
                            {errors.age && <span id="ageError" className="error-msg">{errors.age}</span>}
                            <br /><br />

                            <label>Gender:</label>
                            <label>
                                <input
                                    type="radio"
                                    id="genderMale"
                                    name="Gender"
                                    value="Male"
                                    checked={formData.Gender === "Male"}
                                    onChange={handleChange}
                                    className={isInvalid("Gender") ? "invalid" : ""}
                                />
                                Male
                            </label>
                            <label>
                                <input
                                    type="radio"
                                    id="genderFemale"
                                    name="Gender"
                                    value="Female"
                                    checked={formData.Gender === "Female"}
                                    onChange={handleChange}
                                    className={isInvalid("Gender") ? "invalid" : ""}
                                />
                                Female
                            </label>
                            {errors.Gender && <span id="genderError" className="error-msg">{errors.Gender}</span>}
                            <br /><br />

                            <label htmlFor="address">Address:</label>
                            <input
                                type="text"
                                id="address"
                                name="address"
                                placeholder="Enter your Address"
                                value={formData.address}
                                onChange={handleChange}
                                onBlur={handleBlur}
                                className={isInvalid("address") ? "invalid" : ""}
                            />
                            {errors.address && <span id="addressError" className="error-msg">{errors.address}</span>}
                            <br /><br />
                        </fieldset>

                        {/* Fieldset 2: Patient's Contact */}
                        <fieldset>
                            <legend>Patient's Contact</legend>

                            <label htmlFor="mono">Mobile Number:</label>
                            <input
                                type="tel"
                                id="mono"
                                name="mobilenumber"
                                placeholder="9876543210"
                                value={formData.mobilenumber}
                                onChange={handleChange}
                                onBlur={handleBlur}
                                className={isInvalid("mobilenumber") ? "invalid" : ""}
                            />
                            {errors.mobilenumber && <span id="monoError" className="error-msg">{errors.mobilenumber}</span>}
                            <br /><br />

                            <label htmlFor="email">Email:</label>
                            <input
                                type="text"
                                id="email"
                                name="email"
                                placeholder="arjunpathlabs@gmail.com"
                                value={formData.email}
                                onChange={handleChange}
                                onBlur={handleBlur}
                                className={isInvalid("email") ? "invalid" : ""}
                            />
                            {errors.email && <span id="emailError" className="error-msg">{errors.email}</span>}
                            <br /><br />
                        </fieldset>

                        {/* Fieldset 3: Test & Appointment Details */}
                        <fieldset>
                            <legend>Test & Appointment Details</legend>

                            <label htmlFor="dob">DOB:</label>
                            <input
                                type="date"
                                id="dob"
                                name="dob"
                                value={formData.dob}
                                onChange={handleChange}
                                onBlur={handleBlur}
                                className={isInvalid("dob") ? "invalid" : ""}
                            />
                            {errors.dob && <span id="dobError" className="error-msg">{errors.dob}</span>}
                            <br /><br />

                            <label htmlFor="bloodgroup">Blood Group:</label>
                            <select
                                id="bloodgroup"
                                name="bloodgroup"
                                value={formData.bloodgroup}
                                onChange={handleChange}
                                onBlur={handleBlur}
                                className={isInvalid("bloodgroup") ? "invalid" : ""}
                            >
                                <option value="">Select</option>
                                <option value="A+">A+</option>
                                <option value="A-">A-</option>
                                <option value="B+">B+</option>
                                <option value="B-">B-</option>
                                <option value="O+">O+</option>
                                <option value="O-">O-</option>
                                <option value="AB+">AB+</option>
                                <option value="AB-">AB-</option>
                            </select>
                            {errors.bloodgroup && <span id="bloodgroupError" className="error-msg">{errors.bloodgroup}</span>}
                            <br /><br />

                            <label htmlFor="regdate">Registration Date:</label>
                            <input
                                type="date"
                                id="regdate"
                                name="regdate"
                                value={formData.regdate}
                                onChange={handleChange}
                                onBlur={handleBlur}
                                className={isInvalid("regdate") ? "invalid" : ""}
                            />
                            {errors.regdate && <span id="regdateError" className="error-msg">{errors.regdate}</span>}
                            <br /><br />

                            <label htmlFor="dept">Department:</label>
                            <select
                                id="dept"
                                name="dept"
                                value={formData.dept}
                                onChange={handleChange}
                                onBlur={handleBlur}
                                className={isInvalid("dept") ? "invalid" : ""}
                            >
                                <option value="">Select</option>
                                <option value="General">General Physician</option>
                                <option value="Pathology">Pathology</option>
                                <option value="Cardiology">Cardiology</option>
                            </select>
                            {errors.dept && <span id="deptError" className="error-msg">{errors.dept}</span>}
                            <br /><br />

                            <label>Test Selection:</label>
                            {["CBC", "HbA1c", "LFT", "KFT", "ECG"].map(test => (
                                <label key={test}>
                                    <input
                                        type="checkbox"
                                        id={"test" + test}
                                        name="testsel"
                                        value={test}
                                        checked={formData.testsel.includes(test)}
                                        onChange={handleChange}
                                        className={isInvalid("testsel") ? "invalid" : ""}
                                    />
                                    {" " + test + " "}
                                </label>
                            ))}
                            {errors.testsel && <span id="testError" className="error-msg">{errors.testsel}</span>}
                            <br /><br />

                            <label htmlFor="pad">Preferred Appointment Date:</label>
                            <input
                                type="date"
                                id="pad"
                                name="pad"
                                value={formData.pad}
                                onChange={handleChange}
                                onBlur={handleBlur}
                                className={isInvalid("pad") ? "invalid" : ""}
                            />
                            {errors.pad && <span id="padError" className="error-msg">{errors.pad}</span>}
                            <br /><br />
                        </fieldset>

                        {/* Fieldset 4: Sample & Prescription */}
                        <fieldset>
                            <legend>Sample & Prescription</legend>

                            <label>Sample Collection Preference:</label>
                            <label>
                                <input
                                    type="radio"
                                    id="scpHome"
                                    name="scp"
                                    value="Hc"
                                    checked={formData.scp === "Hc"}
                                    onChange={handleChange}
                                    className={isInvalid("scp") ? "invalid" : ""}
                                />
                                Home Collection
                            </label>
                            <label>
                                <input
                                    type="radio"
                                    id="scpLab"
                                    name="scp"
                                    value="Vl"
                                    checked={formData.scp === "Vl"}
                                    onChange={handleChange}
                                    className={isInvalid("scp") ? "invalid" : ""}
                                />
                                Visit Lab
                            </label>
                            {errors.scp && <span id="scpError" className="error-msg">{errors.scp}</span>}
                            <br /><br />

                            <label htmlFor="udp">Upload Doctor Prescription:</label>
                            <input
                                type="file"
                                id="udp"
                                name="udp"
                                accept=".pdf,.jpg,.jpeg,.png"
                                onChange={handleChange}
                                className={isInvalid("udp") ? "invalid" : ""}
                            />
                            {errors.udp && <span id="udpError" className="error-msg">{errors.udp}</span>}
                        </fieldset>

                        <br /><br />
                        <button type="submit">Register</button>
                        <button type="reset">Reset</button>
                    </form>
                </div>
            );
        }

        // Mount React Component to DOM Root
        const root = ReactDOM.createRoot(document.getElementById("root"));
        root.render(<PatientRegistration />);
    </script>

</body>
</html>
